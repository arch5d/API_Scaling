services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: api_scaling
      POSTGRES_USER: api
      POSTGRES_PASSWORD: api
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  api:
    build: .
    expose:
      - '3000'
    environment:
      DATABASE_URL: postgres://api:api@postgres:5432/api_scaling
      REDIS_URL: redis://redis:6379
      DB_POOL_MAX: 10
      LOG_LEVEL: warn
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    ports:
      - '3000:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
